<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Status | eRAS - MMC</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif, system;
      }

      header {
        padding: 0.5rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0px 0.1rem 0.2rem rgba(0, 0, 0, 0.24);
        background-color: white;
      }

      header > figure {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 1rem;
        cursor: pointer;
      }

      header > figure img {
        height: calc(1.6rem * 2 + 1rem);
        width: auto;
      }

      @media (orientation: landscape) {
        header > figure::after {
          content: "Mechi Multiple Campus";
        }
      }
      @media (orientation: portrait) {
        header > figure::after {
          content: "MMC";
        }
      }
      header > figure::after {
        font-size: 2rem;
        font-weight: bold;
        color: #2b6eb5;
      }

      header > button {
        font-size: large;
        font-weight: bold;
        color: #2b6eb5;
        background-color: transparent;
      }
      header > button:focus,
      header > button:hover {
        color: #ee161f;
      }

      button {
        border: 0;
        border-radius: 0.2rem;
        cursor: pointer;
        width: max-content;
        color: white;
      }

      main {
        padding: 1rem 2rem;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <header>
      <figure>
        <img src="../../assets/img/TU-Logo.svg.png" alt="TU Logo" />
      </figure>
      <button type="button">Log out</button>
    </header>
    <main>
      <h1>{{STATUS}}</h1>
      <p>{{MESSAGE}}</p>
    </main>
  </body>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        window.location.href = window.location.origin;
      }, 3000);

      document
        .querySelector("header > figure")
        .addEventListener("click", () => {
          window.location.href = window.location.origin;
        });

      document.querySelector("header button").addEventListener("click", () => {
        window.location.href = window.location.origin + "/src/logout.php";
      });
    });
  </script>
</html>
