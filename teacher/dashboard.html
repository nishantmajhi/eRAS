<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
    <title>Teacher Dashboard | eRAS - MMC</title>

    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="../assets/css/theme.css" />

    <script src="breadcrumbs.js"></script>
    <script src="dashboard.js"></script>
    <script src="periods.js"></script>
    <script src="../assets/js/logout.js"></script>
  </head>
  <body>
    <header>
      <figure>
        <img src="../assets/img/TU-Logo.svg.png" alt="TU Logo" />
      </figure>
      <button type="button">Log out</button>
    </header>
    <section id="breadcrumbs" title="Goto Dashboard">
      <!-- this section is generated by JS -->
    </section>
    <main>
      <section id="actions">
        <h3 class="title">Please select an option</h3>
        <nav>
          <article id="new">
            <img src="../assets/img/notebook.png" alt="New Icon" />
            <hgroup>
              <h3>New Attendance</h3>
              <h4 class="Nepali">नयाँ हाजिरी</h4>
            </hgroup>
          </article>
          <article id="update">
            <img src="../assets/img/rejected.png" alt="Update Icon" />
            <hgroup>
              <h3>Attendance Correction</h3>
              <h4 class="Nepali">हाजिरी सच्चाउने</h4>
            </hgroup>
          </article>
          <article id="print">
            <img src="../assets/img/printer.png" alt="Print Icon" />
            <hgroup>
              <h3>Print Attendance</h3>
              <h4 class="Nepali">हाजिरी निकाल्ने</h4>
            </hgroup>
          </article>
        </nav>
      </section>
      <section id="periods">
        <!-- this section is generated by JS -->
      </section>
    </main>
  </body>
</html>
