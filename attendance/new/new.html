<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../../favicon.ico" type="image/x-icon" />
    <title>New Attendance | eRAS - MMC</title>

    <link rel="stylesheet" href="new.css" />
    <link rel="stylesheet" href="../../assets/css/theme.css" />
    <link rel="stylesheet" href="../../assets/css/dialog.css" />

    <script src="new.js"></script>
    <script src="../../assets/js/logout.js"></script>
    <script src="../../assets/js/dialog.js"></script>
  </head>
  <body>
    <header>
      <figure>
        <img src="../../assets/img/TU-Logo.svg.png" alt="TU Logo" />
      </figure>
      <button type="button">Log out</button>
    </header>
    <section id="breadcrumbs" title="Goto Dashboard">
      <!-- this section is generated by JS -->
    </section>
    <main>
      <h3 class="title">{{COURSE_TITLE}}</h3>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}" />
        <input type="hidden" name="courseCode" value="{{COURSE_CODE}}" />
        <input type="hidden" name="semester" value="{{SEMESTER_NO}}" />
        <input type="hidden" name="section" value="{{SECTION}}" />
        <table>
          <thead>
            <tr>
              <th>S No.</th>
              <th>Name</th>
              <th>Attendance</th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot>
            <tr>
              <td colspan="3">
                <input
                  type="submit"
                  value="Submit Attendance"
                  aria-label="Submit Attendance"
                  class="positive_button"
                />
              </td>
            </tr>
          </tfoot>
        </table>
      </form>
    </main>
  </body>
</html>
